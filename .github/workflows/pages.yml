name: Deploy Aidoku source list

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '배포할 Release 태그 (비워 두면 최신 정식 Release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download released AIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern package.aix
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern package.aix
          fi

      - name: Install pinned Aidoku CLI
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --git https://github.com/Aidoku/aidoku-rs \
            --rev ae6485e3c14ecd1fd5497d170eae884c68d04a87 --locked aidoku-cli

      - name: Verify package and build source list
        run: sh scripts/build_source_list.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
